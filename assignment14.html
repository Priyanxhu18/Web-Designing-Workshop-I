<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Table</title>
</head>

<body>
    <h2>Friday Lab Schedule</h2>
    <table border="1" cellpadding="8">
        <tr>
            <th>Day</th>
            <th>Lab Batches</th>
            <th>Faculty</th>
            <th>Room</th>
            <th>Time</th>
        </tr>
        <tr>
            <th>Friday</th>
            <td>
                <p><b>Lab Batch Details</b></p>
                <table border="1" cellpadding="6">
                    <tr>
                        <th>Batch</th>
                        <th>System</th>
                    </tr>
                    <tr>
                        <td>A1</td>
                        <td>PC 1-39</td>
                    </tr>
                    <tr>
                        <td>A2</td>
                        <td>PC 40-77</td>
                    </tr>
                </table>
            </td>
            <td>Dr. SPS</td>
            <td>Lab 2</td>
            <td>10:30-12:00PM</td>
        </tr>
    </table>
</body>
</html>
